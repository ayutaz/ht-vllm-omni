{% extends "base.html" %}

{% block content %}
<!-- Tab Navigation -->
<div role="tablist" class="tabs tabs-bordered tabs-lg mb-6" id="main-tabs">
    <a role="tab"
       class="tab tab-active"
       id="tab-btn-extract"
       hx-get="/tab/extract"
       hx-target="#tab-content"
       hx-swap="innerHTML"
       hx-on::after-request="switchTab(this)"
       >1. エンベディング抽出</a>
    <a role="tab"
       class="tab"
       id="tab-btn-cloning"
       hx-get="/tab/cloning"
       hx-target="#tab-content"
       hx-swap="innerHTML"
       hx-on::after-request="switchTab(this)"
       >2. ボイスクローン</a>
    <a role="tab"
       class="tab"
       id="tab-btn-interpolation"
       hx-get="/tab/interpolation"
       hx-target="#tab-content"
       hx-swap="innerHTML"
       hx-on::after-request="switchTab(this)"
       >3. ボイス補間</a>
    <a role="tab"
       class="tab"
       id="tab-btn-emotion-lab"
       hx-get="/tab/emotion-lab"
       hx-target="#tab-content"
       hx-swap="innerHTML"
       hx-on::after-request="switchTab(this)"
       >4. 感情ラボ</a>
</div>

<!-- Tab Content -->
<div id="tab-content">
    <!-- Loading indicator -->
    <div class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>
</div>

<script>
    // Tab switching: update active state
    function switchTab(el) {
        document.querySelectorAll('#main-tabs .tab').forEach(t => t.classList.remove('tab-active'));
        el.classList.add('tab-active');
    }

    // Load Tab 1 on page load
    document.addEventListener('DOMContentLoaded', function() {
        htmx.ajax('GET', '/tab/extract', {target: '#tab-content', swap: 'innerHTML'});
    });
</script>
{% endblock %}
