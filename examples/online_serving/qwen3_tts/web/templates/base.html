<!DOCTYPE html>
<html lang="ja" data-theme="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen3 TTS ボイスクローニング</title>

    <!-- Tailwind CSS + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.23/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="min-h-screen bg-base-300">
    <div class="container mx-auto max-w-6xl px-4 py-6">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent">
                Qwen3 TTS ボイスクローニング
            </h1>
            <p class="mt-2 text-base-content/60">
                話者エンベディングの抽出、ボイスクローン、話者補間、感情操作ができます。
            </p>
        </header>

        {% block content %}{% endblock %}

        <!-- Footer -->
        <footer class="mt-12 text-center text-sm text-base-content/40">
            <p>ECAPA-TDNN + Qwen3-TTS | HT Fork</p>
        </footer>
    </div>

    <!-- Audio Recorder JS -->
    <script src="/static/js/audio-recorder.js"></script>
</body>
</html>
