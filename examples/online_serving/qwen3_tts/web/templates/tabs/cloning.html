<div class="card bg-base-200 shadow-xl">
    <div class="card-body">
        <p class="text-base-content/70 mb-2">
            クローンした声で音声を生成します。音声ソースの優先順位:
        </p>
        <ol class="list-decimal list-inside text-base-content/60 text-sm mb-6 space-y-1">
            <li><strong>エンベディング JSON</strong>（下のフィールドでアップロード）</li>
            <li><strong>リファレンス音声</strong>（+ リファレンステキストで ICL モード）</li>
            <li><strong>タブ1のエンベディング</strong>（セッション経由で自動連携）</li>
        </ol>

        <form id="speech-form"
              hx-post="/api/generate-speech"
              hx-encoding="multipart/form-data"
              hx-target="#speech-result"
              hx-swap="innerHTML"
              hx-indicator="#speech-loading">

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Left Column: Inputs -->
                <div class="space-y-4">
                    <!-- Text Input -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">合成テキスト</span>
                        </label>
                        <textarea name="text"
                                  class="textarea textarea-bordered textarea-primary h-28"
                                  placeholder="合成するテキストを入力..."
                                  required></textarea>
                    </div>

                    <!-- Language -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">言語</span>
                        </label>
                        <select name="language" class="select select-bordered w-full">
                            {% for lang in languages %}
                            <option value="{{ lang }}" {% if lang == "Auto" %}selected{% endif %}>{{ lang }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Reference Audio (optional) -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">リファレンス音声</span>
                            <span class="label-text-alt text-base-content/50">任意</span>
                        </label>
                        <input type="file"
                               id="ref-audio-input"
                               name="ref_audio"
                               accept="audio/*"
                               class="file-input file-input-bordered file-input-sm w-full">
                    </div>

                    <!-- Reference Text (for ICL mode) -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">リファレンステキスト</span>
                            <span class="label-text-alt text-base-content/50">任意 (ICL モード)</span>
                        </label>
                        <div class="flex gap-2">
                            <textarea name="ref_text"
                                      id="ref-text-input"
                                      class="textarea textarea-bordered flex-1 h-16 text-sm"
                                      placeholder="リファレンス音声の書き起こしテキスト（Whisper で自動入力可）"></textarea>
                            <button type="button"
                                    id="transcribe-btn"
                                    class="btn btn-outline btn-sm btn-secondary self-end"
                                    onclick="transcribeRefAudio()">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                    <line x1="12" y1="19" x2="12" y2="23"/>
                                </svg>
                                書き起こし
                            </button>
                        </div>
                        <label class="label">
                            <span class="label-text-alt text-base-content/40">
                                ICL モード (類似度~0.89) はリファレンス音声+テキストが必要。テキスト空欄なら x-vector モード (類似度~0.75) で生成。
                            </span>
                        </label>
                    </div>

                    <!-- Embedding JSON (optional) -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">エンベディング JSON</span>
                            <span class="label-text-alt text-base-content/50">任意（最優先）</span>
                        </label>
                        <input type="file"
                               name="embedding_json"
                               accept=".json"
                               class="file-input file-input-bordered file-input-sm w-full">
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary btn-lg gap-2 w-full sm:w-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        音声を生成
                    </button>
                </div>

                <!-- Right Column: Output -->
                <div>
                    <div id="speech-result">
                        <div class="bg-base-300 rounded-lg p-4 min-h-[200px] flex items-center justify-center">
                            <p class="text-base-content/40 text-sm">
                                生成された音声がここに表示されます
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <!-- Loading Indicator -->
        <div id="speech-loading" class="htmx-indicator mt-4">
            <div class="flex items-center gap-3">
                <span class="loading loading-spinner loading-md text-primary"></span>
                <span class="text-base-content/60">音声を生成中...</span>
            </div>
        </div>

        <!-- Transcription Loading -->
        <div id="transcribe-loading" class="hidden mt-4">
            <div class="flex items-center gap-3">
                <span class="loading loading-spinner loading-sm text-secondary"></span>
                <span class="text-base-content/60 text-sm">Whisper で書き起こし中...</span>
            </div>
        </div>
    </div>
</div>

<script>
async function transcribeRefAudio() {
    const fileInput = document.getElementById('ref-audio-input');
    const textArea = document.getElementById('ref-text-input');
    const btn = document.getElementById('transcribe-btn');
    const loading = document.getElementById('transcribe-loading');

    if (!fileInput.files || fileInput.files.length === 0) {
        alert('先にリファレンス音声を選択してください。');
        return;
    }

    const formData = new FormData();
    formData.append('audio', fileInput.files[0]);

    btn.disabled = true;
    loading.classList.remove('hidden');

    try {
        const resp = await fetch('/api/transcribe', {
            method: 'POST',
            body: formData,
        });
        const data = await resp.json();
        if (data.error) {
            alert('書き起こしエラー: ' + data.error);
        } else {
            textArea.value = data.text;
        }
    } catch (e) {
        alert('書き起こしに失敗しました: ' + e.message);
    } finally {
        btn.disabled = false;
        loading.classList.add('hidden');
    }
}
</script>
