<div class="card bg-base-200 shadow-xl">
    <div class="card-body">
        <p class="text-base-content/70 mb-6">
            感情方向ベクトルをニュートラルな話者エンベディングに適用して音声を合成します。
            <code class="text-primary">emotion_analysis.py direction</code> で生成した
            <code class="text-primary">emotion_directions.json</code> をアップロードしてください。
        </p>

        <form hx-post="/api/emotion-apply"
              hx-encoding="multipart/form-data"
              hx-target="#emotion-result"
              hx-swap="innerHTML"
              hx-indicator="#emotion-loading">

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Left Column: Inputs -->
                <div class="space-y-4">
                    <!-- Directions JSON -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">感情方向ベクトル JSON</span>
                            <span class="label-text-alt">
                                {% if has_directions %}
                                    <span class="badge badge-success badge-sm gap-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                        読み込み済み
                                    </span>
                                {% else %}
                                    <span class="text-base-content/50">初回はアップロード必須</span>
                                {% endif %}
                            </span>
                        </label>
                        <input type="file"
                               name="directions_json"
                               accept=".json"
                               class="file-input file-input-bordered file-input-sm w-full">
                    </div>

                    <!-- Text Input -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">合成テキスト</span>
                        </label>
                        <textarea name="text"
                                  class="textarea textarea-bordered textarea-primary h-28"
                                  placeholder="合成するテキストを入力..."
                                  required></textarea>
                    </div>

                    <!-- Language -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">言語</span>
                        </label>
                        <select name="language" class="select select-bordered w-full">
                            {% for lang in languages %}
                            <option value="{{ lang }}" {% if lang == "Auto" %}selected{% endif %}>{{ lang }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <!-- Emotion Selector -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">感情の方向</span>
                        </label>
                        <div class="flex gap-3 flex-wrap">
                            <label class="label cursor-pointer gap-2 px-4 py-2 rounded-lg bg-base-300 hover:bg-base-100 transition-colors">
                                <input type="radio" name="emotion" value="angry" class="radio radio-error radio-sm" checked>
                                <span class="label-text">怒り</span>
                            </label>
                            <label class="label cursor-pointer gap-2 px-4 py-2 rounded-lg bg-base-300 hover:bg-base-100 transition-colors">
                                <input type="radio" name="emotion" value="sad" class="radio radio-info radio-sm">
                                <span class="label-text">悲しみ</span>
                            </label>
                            <label class="label cursor-pointer gap-2 px-4 py-2 rounded-lg bg-base-300 hover:bg-base-100 transition-colors">
                                <input type="radio" name="emotion" value="smile" class="radio radio-warning radio-sm">
                                <span class="label-text">笑顔</span>
                            </label>
                        </div>
                    </div>

                    <!-- Alpha Slider -->
                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-semibold">Alpha（方向の強さ）</span>
                            <span class="label-text-alt font-mono text-lg font-bold" id="alpha-display">1.0</span>
                        </label>
                        <input type="range"
                               name="alpha"
                               min="0" max="2" step="0.1" value="1.0"
                               class="range range-primary"
                               oninput="document.getElementById('alpha-display').textContent = parseFloat(this.value).toFixed(1)">
                        <div class="flex justify-between text-xs text-base-content/40 px-1 mt-1">
                            <span>0.0（ニュートラル）</span>
                            <span>1.0（自然）</span>
                            <span>2.0（誇張）</span>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary btn-lg gap-2 w-full sm:w-auto">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        音声を生成
                    </button>
                </div>

                <!-- Right Column: Output -->
                <div>
                    <div id="emotion-result">
                        <div class="bg-base-300 rounded-lg p-4 min-h-[200px] flex items-center justify-center">
                            <p class="text-base-content/40 text-sm">
                                生成された音声がここに表示されます
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <!-- Loading Indicator -->
        <div id="emotion-loading" class="htmx-indicator mt-4">
            <div class="flex items-center gap-3">
                <span class="loading loading-spinner loading-md text-primary"></span>
                <span class="text-base-content/60">感情方向を適用して音声を生成中...</span>
            </div>
        </div>
    </div>
</div>
